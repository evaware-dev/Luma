plugins {
    id 'net.fabricmc.fabric-loom-remap' apply false
    id "org.jetbrains.kotlin.jvm" apply false
}


def jitPackBuild = System.getenv("JITPACK") == "true"
def publishedGroup = jitPackBuild && System.getenv("GROUP") != null
    ? System.getenv("GROUP")
    : project.maven_group
def githubRepository = System.getenv("GITHUB_REPOSITORY")

allprojects {
    ext.maven_group = publishedGroup
}

subprojects {
    plugins.withId("maven-publish") {
        if (githubRepository != null) {
            publishing {
                repositories {
                    maven {
                        name = "GitHubPackages"
                        url = uri("https://maven.pkg.github.com/${githubRepository}")
                        credentials {
                            username = System.getenv("GITHUB_ACTOR") ?: System.getProperty("gpr.user")
                            password = System.getenv("GITHUB_TOKEN") ?: System.getProperty("gpr.token")
                        }
                    }
                }
            }
        }
    }

    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
    }
}
