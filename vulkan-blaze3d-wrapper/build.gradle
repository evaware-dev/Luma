plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "vulkan-blaze3d-wrapper"
}

repositories {
    mavenCentral()
}

dependencies {
    api project(":api")
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    implementation platform("org.lwjgl:lwjgl-bom:${project.lwjgl_version}")
    implementation "org.lwjgl:lwjgl"
    implementation "org.joml:joml:${project.joml_version}"

    testRuntimeOnly "org.lwjgl:lwjgl::natives-windows"
    testRuntimeOnly "org.lwjgl:lwjgl::natives-linux"
    testRuntimeOnly "org.lwjgl:lwjgl::natives-macos"

    testImplementation "junit:junit:4.13.2"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.maven_group
            artifactId = "vulkan-blaze3d-wrapper"
            version = project.mod_version
        }
    }
}
