name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)release (e.g. v1.0.0)
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Tag '$TAG' does not match v<version>"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            core/build/libs/*.jar

      - name: Warm up JitPack build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          URL="https://jitpack.io/com/github/${OWNER}/${REPO_NAME}/${TAG}/build.log"
          echo "Triggering: $URL"
          curl -fsSL --retry 5 --retry-delay 10 "$URL" -o jitpack-build.log || {
            echo "JitPack ping failed (build may still be queued)"; exit 0;
          }
          echo "--- last lines of jitpack build log ---"
          tail -n 40 jitpack-build.log || true
