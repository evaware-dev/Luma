name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & test
        run: ./gradlew --no-daemon build

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: libraries
          path: |
            api/build/libs/*.jar
            core-gl/build/libs/*.jar
            developer-tools/build/libs/*.jar
            shader-translator/build/libs/*.jar
            vulkan-blaze3d-wrapper/build/libs/*.jar
            minecraft-render-library/build/libs/*.jar
            minecraft-implementation/build/libs/*.jar
            standalone-app/build/libs/*.jar
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
