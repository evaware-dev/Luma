pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'Luma'

include 'api'
include 'core-gl'
include 'vulkan-blaze3d-wrapper'
include 'shader-translator'
include 'minecraft-render-library'
include 'minecraft-implementation'
include 'standalone-gl-app'

project(':standalone-gl-app').projectDir = new File(settingsDir, 'standalone-gl-app')