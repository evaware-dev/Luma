plugins {
    id 'net.fabricmc.fabric-loom'
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
}

def minecraft_version = "26.3"
def loader_version = "0.19.5"
def fabric_api_version = "0.162.0+26.3"
def fabric_kotlin_version = "1.13.12+kotlin.2.4.0"

version = project.mod_version
group = project.maven_group

base {
    archivesName = "minecraft-render-library-26.3"
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"

    api project(":api")
    api project(":core-gl")
    api project(":vulkan-blaze3d-wrapper")
    api project(":shader-translator")
}


tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.maven_group
            artifactId = "minecraft-render-library-26.3"
            version = project.mod_version
        }
    }
}
